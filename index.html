<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astralfn</title>

    <!-- Open Graph meta tags -->
    <meta property="og:title" content="Astral" />
    <meta property="og:description" content="" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/particles.css" media="screen" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/images/IMG_0169.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@200&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <script crossorigin="anonymous" src="https://kit.fontawesome.com/9105e9014d.js"></script>
</head>
<body>
    <!-- Background Video -->
    <video autoplay muted loop id="video-background" playsinline>
        <source src="assets/vids/videoplayback.mp4" type="video/mp4" />
        Your browser does not support HTML5 video.
    </video>

    <!-- Particles.js container -->
    <div id="particles-js"></div>

    <!-- Modal Structure -->
    <div class="modal" id="modal">
        <div class="modal__container">
            <div class="modal__content">
                <h1 class="modal__title">click</h1>
            </div>
            <i id="close" class="fas fa-times" aria-hidden="true" onclick="closeModal()"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="center">
        <h1>Astral</h1>
        <p>OGFN for free!!!</p>
        <p class="skush">Getting better Every Day!!!</p>
        <p class="skush">Multiplayer + and more!!!</p>
        <div class="btn">
            <a href="https://discord.gg/astralfn" class="btn-link">
                <p class="btns"><i class="fa-brands fa-discord"></i> Discord</p>
            </a>
            <a href="https://m.youtube.com/@AstralOGFN" class="btn-link">
                <p class="btns"><i class="fa-brands fa-youtube"></i> YouTube</p>
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/particles.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/custom.js"></script>

    <script>
        // Function to play the video and unmute
        function playVideo() {
            const video = document.getElementById("video-background");
            video.play();
            video.muted = false;
            video.volume = 0.3;
            console.log("Playing video");
        }

        // Function to close modal
        function closeModal() {
            const modal = document.getElementById("modal");
            modal.style.display = "none";
        }

        // Example: open modal on some event (if needed)
        // document.getElementById('someButton').addEventListener('click', () => {
        //     document.getElementById('modal').style.display = 'block';
        // });
    </script>
</body>
